# Claude in der GitHub-Cloud (SIN-1126, Vorlage: siinanXD/stromlauf-ai, SIN-205): läuft Aufgaben, wenn der PC aus ist.
# Auslöser: @claude in Issue-/PR-Kommentaren und Reviews, oder Label "claude" auf einem Issue.
# Es läuft nur für Nutzer mit Schreibrechten (Standard der Action).
# Kein github_token: die Action nutzt die Claude-GitHub-App, damit CI auf Claudes Commits läuft.
# Bei Aufträgen aus einem Issue öffnet Claude den PR selbst (gh pr create mit dem App-Token).
# Danach entscheidet das Gate (gate.yml): ohne Label Codex-Review, risk:low mergt bei grünem build, risk:high wartet auf Review.
# Vor dem Push prüft Claude selbst (AGENTS.md Regel 7): npm ci, lint, typecheck, test, build.
# Kein Docker, keine Datenbank: Aufgaben mit Änderungen unter supabase/ bleiben am PC (Regel 7, `supabase test db` vor dem Push); build.yml prüft sie zusätzlich in CI.
# Workflow-Dateien kann Claude nicht pushen (Token ohne workflows-Recht), Änderungen an .github/ laufen über die lokale Sitzung.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Nur Owner, Mitglieder und Collaborators lösen aus (Codex-Review SIN-1126): sonst startet jeder @claude-Kommentar einen Runner.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      || (github.event_name == 'issues' && github.event.label.name == 'claude' && github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Gleiche Node-Version wie build.yml, damit lokale Prüfung und CI dasselbe sehen.
      - name: Node für Prüfungen bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(cd:*),Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(npm audit:*),Bash(npx tsc:*),Bash(npx vitest:*),Bash(npx eslint:*),Bash(npx next typegen:*),Bash(node --check:*)"
            --append-system-prompt "Lies zuerst AGENTS.md im Repo und halte dich an die Regeln dort. PR-Regel: Wurdest du auf einem Issue ausgelöst und hast Commits auf deinen eigenen Branch gepusht, öffne den Pull Request selbst mit: gh pr create --head <dein Branch> --base <Default-Branch> --title <Titel> --body <Text>. Kein Draft. Titel als Conventional Commit mit Linear-ID, z. B. docs(readme): Hinweis ergänzen (SIN-123). Body beginnt mit 'Closes #<Issue-Nummer>' und sagt in zwei Sätzen, was geändert wurde. Prüfe vorher mit gh pr list --head <dein Branch>, ob es schon einen PR gibt. Schreib danach den Link zum PR in deinen Kommentar statt des Create-PR-Links. Nie mergen, nie Labels setzen oder entfernen. Wurdest du auf einem PR ausgelöst, öffne keinen neuen PR. Prüfen vor dem Push (AGENTS.md Regel 7): npm ci, dann npm run lint, npm run typecheck, npm test und npm run build. Kein Docker und kein supabase-CLI in der Cloud. Aufgaben, die Dateien unter supabase/ ändern, bearbeitest du hier nicht: AGENTS.md Regel 7 verlangt supabase test db vor dem Push. Schreib dann in deinen Kommentar, dass die Aufgabe am PC laufen muss, und beende ohne Commit. Keine neuen npm-Pakete (AGENTS.md Regel 3). Keine Secrets lesen, ausgeben oder einchecken. Committe nie node_modules, .next oder andere Build-Ausgaben. Schreib in deinen Kommentar, welche Prüfungen grün waren und welche du nicht ausführen konntest."
