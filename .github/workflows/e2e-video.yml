name: e2e-video

# SIN-1159 Demo: ruft den wiederverwendbaren Workflow aus leitstand-2 auf (docs/pr-video.md dort).
on: pull_request

concurrency:
  group: e2e-video-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  video:
    # Lifestyle-APP ist öffentlich, leitstand-2 privat: der Aufruf über die Repo-Grenze scheitert
    # ("workflow was not found"), daher für die Demo eine unveränderte Kopie.
    uses: ./.github/workflows/pr-video.yml
    permissions:
      contents: write
      pull-requests: write
      deployments: read
